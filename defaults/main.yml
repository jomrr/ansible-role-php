---
# role: php
# file: defaults/main.yml

# Additional distribution packages providing application extensions.
php_extra_packages: []
# - php-mbstring

# Selected extension INI files to manage in the FPM scan directory.
php_modules: []
# - name: bz2
#   state: enabled
# - name: xdebug
#   state: disabled
#   directive: zend_extension

# Baseline PHP settings merged with php_ini_settings.
php_ini_defaults:
  expose_php: 'Off'
  display_errors: 'Off'
  display_startup_errors: 'Off'
  log_errors: 'On'
  allow_url_include: 'Off'
  cgi.fix_pathinfo: '0'
  opcache.validate_permission: '1'
  opcache.validate_root: '1'
  session.use_strict_mode: '1'
  session.use_only_cookies: '1'
  session.cookie_httponly: '1'
  session.cookie_secure: '1'
  session.cookie_samesite: Lax

# Site-wide overrides of the PHP baseline using native INI directive names.
php_ini_settings: {}
# memory_limit: 256M

# Baseline native FPM pool directives merged with each pool's settings.
php_fpm_pool_defaults:
  listen.mode: '0660'
  listen.allowed_clients: 127.0.0.1,::1
  pm: dynamic
  pm.max_children: 10
  pm.start_servers: 2
  pm.min_spare_servers: 1
  pm.max_spare_servers: 3
  pm.max_requests: 500
  pm.process_idle_timeout: 10s
  process.dumpable: 'no'
  rlimit_core: '0'
  catch_workers_output: 'yes'
  clear_env: 'yes'
  security.limit_extensions: .php
  request_terminate_timeout: 120s
  php_admin_flag[log_errors]: 'on'
  php_admin_flag[display_errors]: 'off'
  php_admin_value[error_log]: /proc/self/fd/2
  php_admin_value[memory_limit]: 128M

# Authoritative FPM pools with optional native settings and environment maps.
php_fpm_pools:
  - name: www
# - name: kanboard
#   settings:
#     user: nginx
#     group: nginx
#     listen.owner: nginx
#     listen.group: nginx
#     chdir: /var/www/kanboard
#   environment:
#     PATH: /usr/local/bin:/usr/bin:/bin

# Native global FPM directives overriding the platform baseline.
php_fpm_global_settings: {}
# process.max: '64'
